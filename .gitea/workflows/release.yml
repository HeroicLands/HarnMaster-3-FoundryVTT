name: Version and Release

# The whole release process, from a merged pull request to a downloadable
# system. Nothing here is started by hand.
#
#   1. A pull request declares its bump as a `.changeset/*.md` file.
#   2. Merging it to `main` opens or updates the **Version Packages** pull
#      request: the version bump plus the rewritten CHANGELOG.md.
#   3. Merging *that* leaves no changesets, which is the signal to build the
#      system, package it, and cut the `v<version>` tag and the GitHub Release
#      that Foundry installs from.
#
# The steps live in HeroicLands/.github, not here, so every package releases
# the same way.
#
# Releasing is gated by the repository variable HL_RELEASE_ENABLED.
#
# This repository ships a **system**, not an npm package, so there is no
# publish step and no registry credential. The release *is* the tag and its
# assets: `system.zip`; the `system.json` an already-installed system checks
# for updates against; and `schema.json`, which a module depending on this
# system reads to check what it emits against what a document will actually
# receive.

on:
    push:
        branches: [main]
    # Manual recovery: re-runs the decision for a version that is merged and
    # versioned but never got its release. An existing tag is skipped rather
    # than duplicated, so running this is safe.
    workflow_dispatch:

# Contents are read-only: the shared workflow pushes with the release bot's
# token, not the job token.
permissions:
    contents: read

jobs:
    release:
        uses: HeroicLands/.github/.gitea/workflows/release-foundry-package.yml@main
        with:
            package-kind: system
        secrets:
            RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
            GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
