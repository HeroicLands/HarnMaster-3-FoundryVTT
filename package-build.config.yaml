contentPackage: hm3
packageKind: systems

stats:
    lastModifiedBy: hm3build00000000

compatibility:
    minimum: "14"
    verified: "14.367"

# Per-pack `ownership` is deliberately not carried: the manifest generator
# does not emit it, so Foundry's defaults apply.
packs:
    - { name: items, label: Items, type: Item }
    - { name: system-help, label: System Help, type: JournalEntry }

# Written out explicitly, since a mode inherited by omission reads as a
# question nobody asked: publish the authored homepage at `/hm3/` and nothing
# else. There is no content tree here for `content` to publish.
publish:
    site: homepage

site:
    assets: https://cdn.heroiclands.org
    description: The HârnMaster 3 system for Foundry VTT.
    # This package has one route, so the routes back lead out to the rest of
    # the site.
    notfound:
        tagline: This package has no page at
        sitenoun: site
        links:
            - title: HârnMaster 3 for Foundry VTT
              url: /
              text: What the system does, and the manifest URL to install it.
            - title: Heroic Lands
              url: https://www.heroiclands.org/
              text: Everything published here, from the top.
            - title: Source and issues
              url: https://github.com/HeroicLands/HarnMaster-3-FoundryVTT
              text: The repository, where bugs and requests are tracked.
    hugo:
        markup:
            highlight:
                style: monokai

packageBuild:
    # One entry per document class: this system keeps one registry per file.
    schema:
        Item: { from: module/data/item-models.js, registry: itemModels }
        Actor: { from: module/data/actor-models.js, registry: actorModels }

    # `css/` and `system.json` are absent: `build:css` and `build:system`
    # write them into the stage directly. The data model lives in
    # `module/data/`, registered on `CONFIG.Actor.dataModels` /
    # `CONFIG.Item.dataModels`; its subtypes are declared as `documentTypes`
    # in the manifest below.
    assets:
        - { from: module, to: module }
        - { from: templates, to: templates }
        - { from: lang, to: lang }
        - { from: images, to: images }
        - { from: fonts, to: fonts }
        - { from: audio, to: audio }
        - { from: ui, to: ui }
        - { from: lib, to: lib }
        - { from: LICENSE, to: LICENSE }
        - { from: README.md, to: README.md }
        - { from: WALKTHROUGH.md, to: WALKTHROUGH.md }
        # Not a committed file: `package-build schema` writes it to
        # `build/schema.json`, and this stages it into the release archive so
        # a dependent module's `deps fetch` reads the schema pinned to the
        # release it targets.
        - { from: build/schema.json, to: schema.json }

    lang:
        sources: lang/*.json

    # `FOUNDRYVTT_<STAGE>_DATA` picks the data root a deploy writes into.
    deploy:
        envPrefix: HM3

    e2e:
        # Almost nothing is declared here since almost none of it is this
        # repository's to state: the world id and Gamemaster derive from the
        # package id (`hm3-e2e`, `Gamemaster` / `hm3-e2e`), the port is the
        # `test` stage's conventional one, and the Foundry build is
        # `compatibility.minimum` above. `npm run e2e:sweep -- <build>` runs
        # the full suite against a build this repository does not pin.
        suite:
            run: [npx, cypress, run]
            open: [npx, cypress, open]

        # In the order they must run: `assets` empties the stage, so it runs
        # first; `system` writes the manifest Foundry reads once at world
        # launch, so producing it recreates the container instead of merely
        # restarting it.
        build:
            assets: build:assets
            css: build:css
            db: build:compiledb
            system: { script: build:system, recreate: true }

        # The actors from Part 0 of the manual test plan, compiled into the
        # seeded world so every spec starts from the same known state. Their
        # gear and skills are not seeded: adding those is what the drag-and-drop
        # specs exercise, and baking them in would skip the code under test.
        documents:
            actors: cypress/fixtures/actors

    manifest:
        title: HarnMaster 3
        descriptionHtml: The HarnMaster system for FoundryVTT!
        authors:
            - name: Toasty
              discord: toasty#8538
        license: LICENSE
        readme: README.md
        flags:
            allowBugReporter: true
        esmodules:
            - module/hm3.js
        styles:
            - css/hm3.css
        languages:
            - { lang: en, name: English, path: lang/en.json }

        documentTypes:
            Actor:
                character: {}
                creature: {}
                container: {}
            Item:
                skill: {}
                spell: {}
                invocation: {}
                psionic: {}
                weapongear: {}
                containergear: {}
                missilegear: {}
                armorgear: {}
                miscgear: {}
                injury: {}
                armorlocation: {}
                trait: {}
        # The compendium folder Foundry groups this system's packs under. Its
        # `packs` list must name every pack declared above: a name matching no
        # pack is an error, and a pack named by no folder is a warning. Edited
        # by hand when a pack is added or removed.
        packFolders:
            - name: HârnMaster 3 System
              sorting: m
              packs: [items, system-help]
        socket: true
        grid: { distance: 5, units: ft }
        primaryTokenAttribute: shockIndex
