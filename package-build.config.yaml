# How `@heroiclands/package-build` builds this system.
#
# HM3 uses only the packaging half of the toolchain. Its compendium content is
# committed JSON under `assets/packs/<name>/`, not a Markdown content tree, so
# there is no `itemBuilders` registry and no `assets/content/`. The two halves
# are independent: `packs:` below is a *declaration* of what this package ships,
# and nothing here requires the packs to have been generated from Markdown.
#
# `foundryPackage` is not declared — it is read from `package.json`'s `name`.

contentPackage: hm3
packageKind: systems

stats:
    lastModifiedBy: hm3build00000000

# The Foundry core range. `minimum` is what every compiled document is stamped
# with as `_stats.coreVersion`, so moving it moves the stamp.
compatibility:
    minimum: "14"
    verified: "14.367"

# The one pack list. `packs[]` in the generated `system.json` is derived from
# it — label, type, name, the `hm3` system id and the `packs/<name>` path — so
# a pack is declared here and nowhere else.
#
# Note: per-pack `ownership` is deliberately not carried. The manifest
# generator does not emit it, so Foundry's defaults apply. This was a conscious
# trade rather than an oversight.
packs:
    - { name: items, label: Items, type: Item }
    - { name: system-help, label: System Help, type: JournalEntry }

# What this package publishes to the web. `homepage` is the default and is what
# this repository would get with no `publish:` block at all — it is written out
# because a mode inherited by omission reads, to the next person, as a question
# nobody asked. It means: publish the authored homepage at `/hm3/` and nothing
# else. There is no content tree here to publish, and `content` would look for
# one; the other mode is not a thing this repository could switch to by editing
# a line.
#
# `manifests` and `address` are left at their defaults for the same reason they
# are absent everywhere else that has no cross-package links: HM3 neither
# publishes a link manifest nor consumes one.
publish:
    site: homepage

# Where the homepage is written. `out` is the only key that means anything in
# `homepage` mode — the content surfaces are fenced off by the mode itself — but
# it is required rather than defaulted, deliberately: the directory is wiped on
# every run, and an unset value would resolve to the repository root, so the
# build refuses it instead of resolving it. The path matches the sibling
# convention; the tree is a build artifact and is gitignored.
site:
    out: site/content

packageBuild:
    # Everything Foundry loads that is not generated. `css/` is absent on
    # purpose: it is compiled straight into the stage by `build:css`, and
    # `system.json` is written into the stage by `build:system`.
    #
    # `template.json` is gone: the data model is `module/data/`, registered on
    # CONFIG.Actor.dataModels / CONFIG.Item.dataModels, and the subtypes are
    # declared as `documentTypes` in the manifest above.
    assets:
        - { from: module, to: module }
        - { from: templates, to: templates }
        - { from: lang, to: lang }
        - { from: images, to: images }
        - { from: fonts, to: fonts }
        - { from: audio, to: audio }
        - { from: ui, to: ui }
        - { from: lib, to: lib }
        - { from: LICENSE, to: LICENSE }
        - { from: README.md, to: README.md }
        - { from: WALKTHROUGH.md, to: WALKTHROUGH.md }

    lang:
        sources: lang/*.json

    # `FOUNDRYVTT_<STAGE>_DATA` picks the data root a deploy writes into.
    deploy:
        envPrefix: HM3

    # The end-to-end harness: a disposable Foundry world, seeded from scratch,
    # with Cypress driving a real browser against it.
    #
    # Almost nothing is stated here because almost nothing is this repository's
    # to state. The world id and the Gamemaster derive from the package id
    # (`hm3-e2e`, `Gamemaster` / `hm3-e2e`), the port is the conventional one
    # for the `test` stage, and the Foundry build is `compatibility.minimum`
    # above — the floor is the claim the suite exists to defend, so the claim
    # and the evidence for it are one number. `npm run e2e:sweep -- <build>`
    # runs the full suite against a build this repository does not pin.
    e2e:
        # The one thing the harness does not own: what runs against the world.
        suite:
            run: [npx, cypress, run]
            open: [npx, cypress, open]

        # What the fast loop can rebuild, in the order it must be built. The
        # asset pass empties the stage, so it goes first; `system` writes the
        # manifest, which Foundry reads once at world launch, so producing it
        # means the container is recreated rather than merely restarted.
        build:
            assets: build:assets
            css: build:css
            db: build:compiledb
            system: { script: build:system, recreate: true }

        # The actors from Part 0 of the manual test plan, compiled into the
        # seeded world so every spec starts from the same known state. Their
        # gear and skills are not seeded: adding those is what the drag-and-drop
        # specs exercise, and baking them in would skip the code under test.
        documents:
            actors: cypress/fixtures/actors

    # Emitted as declared. The identity, the four release addresses, the
    # version, the compatibility range and the pack list are derived instead,
    # and are refused if also declared here.
    manifest:
        title: HarnMaster 3
        description: The HarnMaster system for FoundryVTT!
        authors:
            - name: Toasty
              discord: toasty#8538
        license: LICENSE
        readme: README.md
        flags:
            allowBugReporter: true
        esmodules:
            - module/hm3.js
        styles:
            - css/hm3.css
        languages:
            - { lang: en, name: English, path: lang/en.json }

        # The document subtypes this system provides. These used to be implied
        # by template.json having a key per type; that file is deprecated in
        # v14 and removed in v16, so they are declared here and their shapes
        # live in module/data/ as data models.
        documentTypes:
            Actor:
                character: {}
                creature: {}
                container: {}
            Item:
                skill: {}
                spell: {}
                invocation: {}
                psionic: {}
                weapongear: {}
                containergear: {}
                missilegear: {}
                armorgear: {}
                miscgear: {}
                injury: {}
                armorlocation: {}
                trait: {}
        # The compendium folder Foundry groups this system's packs under. Its
        # `packs` list names packs by the same `name` the `packs:` block above
        # declares, and must name all of them: a name that matches no pack
        # resolves to nothing, and a pack named by no folder sits loose in the
        # browser. Both are reported since package-build 6.0.0
        # (HeroicLands/package-build#81, which #420 asked for): a folder naming
        # a pack this package does not ship is an error that stops the manifest
        # write, and a pack named by no folder is a warning. So this list still
        # has to be edited by hand when a pack is added or removed, but no
        # longer silently.
        packFolders:
            - name: HârnMaster 3 System
              sorting: m
              packs: [items, system-help]
        socket: true
        grid: { distance: 5, units: ft }
        primaryTokenAttribute: shockIndex
