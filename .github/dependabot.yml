# Dependabot version updates.
#
# Labels are pinned to `area/devops`, which is defined in the organisation label
# set. Dependabot's own default label, `dependencies`, is not part of it.
#
# Routine minor and patch bumps are grouped by dependency type. A major bump is
# a decision, not housekeeping, so it arrives as its own pull request with its
# own changelog to read.
#
# That reasoning inverts below 1.0, which is where the first-party package
# sits. A `0.x` package signals a breaking change with a **minor** bump —
# `0.4.0` to `0.5.0` is the break — and the major rule never fires, because
# `1.0.0` never arrives. So `@heroiclands/*` is matched ahead of the catch-alls
# and never grouped: it gets its own pull request for every update type. See
# #437.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - area/devops
      commit-message:
          prefix: chore(deps)
          prefix-development: chore(deps-dev)
      groups:
          # First-party packages, ahead of everything: each is its own decision and
          # neither may be swept into a grouped housekeeping pull request. A group
          # of one still yields one pull request per package, which is the point.
          # Dependabot assigns a dependency to the first group it matches, so the
          # order of these entries is what does the work.
          package-build:
              patterns:
                  - "@heroiclands/package-build"
          production-minor-patch:
              dependency-type: production
              update-types:
                  - minor
                  - patch
          development-minor-patch:
              dependency-type: development
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - area/devops
      commit-message:
          prefix: chore(ci)
      groups:
          github-actions:
              patterns:
                  - "*"
