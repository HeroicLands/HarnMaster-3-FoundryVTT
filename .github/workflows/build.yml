name: Build

# The pull request gate. Until this landed the system had no CI at all: nothing
# checked that a change still installed, still compiled its compendium packs, or
# still produced a loadable manifest. That was survivable while one person held
# the whole build in their head, and stops being survivable the moment a second
# person opens a pull request.

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# A second push to the same branch supersedes the first; nothing here needs the
# older run to finish.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Its own job, and needing no install, so it reports in seconds and reports
    # independently of whether the build passes. The compendium source is the
    # JSON under assets/packs/<name>/; the LevelDB is build output and belongs
    # in build/stage/packs/, which is not tracked.
    #
    # `packs/.gitignore` has listed these patterns for years and was not enough:
    # .gitignore is advice to `git add`, so a contributor who needed loadable
    # packs and could not see how to build them commented the rule out and
    # committed the binaries instead (#398). Until now they were right that
    # there was no other way — there was no build step that produced them. Now
    # there is, and this makes the rule enforceable rather than advisory.
    no-compiled-packs:
        name: No compiled packs committed
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: node utils/check-no-compiled-packs.mjs

    # The content tree. Until #432 nothing in this repository read a note's
    # frontmatter at all: the lint-shaped scripts were `lint:lang`,
    # `lint:packs` and `lint:roundtrip`, none of which looks at
    # `assets/content/`. `content-build lint` is the only command that runs the
    # frontmatter linter, so no finding of any kind reached here.
    #
    # Two of the four checks `npm run lint` chains run here, and only two.
    # `lint:format` and `lint:markdown` are deliberately absent: neither has
    # ever run against this tree, and both arrive with a backlog nobody in the
    # pull request being blocked put there — 110 unformatted files of 145 once
    # the compendium source is excluded (12 of them HTML templates Prettier
    # cannot even parse), and 26 markdownlint findings, almost all emphasis
    # style. A gate that cannot go green teaches everyone to merge past a red
    # check, and the check then stops meaning anything. Those backlogs are
    # recorded as #434 and #435; when they clear, these two steps collapse into
    # a single `npm run lint`, which already chains all six.
    #
    # Neither step needs a build: both read the tree directly, so this job
    # installs and reports without waiting on the compile below.
    content-lint:
        name: Content lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Every note's address and frontmatter: the schema, the retired
            # `package:` and `draft:` fields, duplicate `(type, shortcode)`
            # addresses, and the address-bearing fields a `type: homepage` note
            # refuses.
            - name: Addresses and frontmatter
              run: npm run lint:addresses

            # Every anchor link lands and every qualified address resolves,
            # including the homepage's own links.
            - name: Content links
              run: npm run lint:content-links

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # A localization file whose keys collide on a dotted prefix makes
            # foundry.utils.expandObject throw, and Foundry then drops the whole
            # translation — so this is a build failure, not a lint opinion.
            - name: Localization
              run: npm run lint:lang

            # The combat result tables, the utility helpers and the shape of
            # CONFIG.HM3, none of which need Foundry. Under a second, and a
            # failure names the rule that broke rather than just reporting that
            # the system would not load.
            - name: Unit tests
              run: npm test

            # Compiles the styles, stages the assets, builds the compendium
            # packs from their committed JSON, and generates system.json. A
            # failure here means the system would not load.
            - name: Build
              run: npm run build:noci

            # The manifest is generated, so the thing worth asserting is that it
            # came out loadable: the id Foundry keys everything off, and one
            # entry per declared pack.
            - name: Check the generated manifest
              run: |
                  node --input-type=module -e '
                    import { readFileSync } from "node:fs";
                    const m = JSON.parse(readFileSync("build/stage/system.json", "utf8"));
                    if (m.id !== "hm3") throw new Error(`id is ${m.id}, expected hm3`);
                    if (m.packs.length !== 2) throw new Error(`${m.packs.length} packs, expected 2`);
                    console.log(`system.json ok: ${m.id} ${m.version}, ${m.packs.length} packs`);
                  '
